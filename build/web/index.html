<!DOCTYPE html>
<html>
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="CricPavilion Pro - Live Cricket Match Centre, Real-Time Ball-by-Ball Scoring & Tournament Management">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="CricPavilion Pro">
  <meta property="og:title" content="CricPavilion Pro • Live Cricket Match Centre">
  <meta property="og:description" content="Watch real-time ball-by-ball cricket live scores, commentary, and full scorecards on CricPavilion Pro.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="CricPavilion Pro • Live Cricket Match Centre">
  <meta name="twitter:description" content="Watch real-time ball-by-ball cricket live scores, commentary, and full scorecards.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CricPavilion">
  <meta name="theme-color" content="#0C1322">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>CricPavilion Pro - Cricket Platform</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #0C1322;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    #loading-splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at 50% 35%, #131E33 0%, #0A0F1D 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      pointer-events: none;
      transition: opacity 0.5s ease-out;
    }
    .brand-title {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 1.5px;
      margin-bottom: 24px;
      background: linear-gradient(135deg, #00F5A0 0%, #00D9F5 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3.5px solid rgba(0, 245, 160, 0.15);
      border-top-color: #00F5A0;
      border-radius: 50%;
      animation: cric-spin 0.85s cubic-bezier(0.5, 0.1, 0.5, 0.9) infinite;
    }
    .loading-text {
      margin-top: 18px;
      font-size: 13px;
      letter-spacing: 0.8px;
      color: rgba(255, 255, 255, 0.6);
      font-weight: 500;
    }
    @keyframes cric-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading-splash">
    <div class="brand-title">CRICPAVILION</div>
    <div class="spinner"></div>
    <div class="loading-text">Loading Cricket Platform...</div>
  </div>

  <div id="recaptcha-container"></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('loading-splash');
      if (splash) {
        splash.style.opacity = '0';
        setTimeout(function() { splash.remove(); }, 500);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
